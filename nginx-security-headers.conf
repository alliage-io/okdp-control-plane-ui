# Security headers, included at server level and again in every location that
# sets its own add_header: nginx drops the inherited add_header directives of a
# level as soon as that level declares one. `always` also covers error answers
# (the /api/ 404, 5xx).
#
# Only frame-ancestors for now: a full Content-Security-Policy needs the inline
# theme script of index.html hashed and the fonts onload handler removed.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
