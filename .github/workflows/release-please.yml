name: release-please

# On every push to main, compute the next semantic version from the
# conventional commits and open/refresh a release PR. Merging that PR
# bumps .release-please-manifest.json and creates the tag + GitHub release.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # release-please tags and releases
      pull-requests: write   # release-please opens/updates the release PR
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
