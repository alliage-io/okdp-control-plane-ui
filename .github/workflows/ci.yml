name: ci

# Lint, test and build the console on every push to main and every pull
# request, so regressions are caught before merge. This is the workflow the
# README ci badge points to.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No --fix in CI: report lint violations instead of silently fixing them.
      - run: npx eslint src
      - run: npm test
      - run: npm run build
